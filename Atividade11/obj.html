<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de criar objetos</title>
</head>

<body>
    <script>
        var aluno1 = new Object();
        // usando object
        aluno1.ra = "0030482413033";
        aluno1.nome = "Alana";
        alert(`ra=${aluno1.ra} nome=${aluno1.nome}`)


        var aluno2 = {}; //usando {}
        aluno2.ra = "1234";
        aluno2["nome"] = "Gabriela";
        alert("ra=" + aluno2.ra + " nome =" + aluno2.nome);
        aluno2["email do aluno"] = "gabriela@gmail.com";
        alert(aluno2["email do aluno"]);


        var aluno3 = {//literal
            ra: "12345",
            nome: "Marcos",
        };
        alert("ra=" + aluno3.ra + " nome=" + aluno3.nome);
        
        
        //usando func construtora
        function Aluno(ra, nome) {
            this.ra = ra;
            this.nome = nome;
            this.MostraDados = function() {
                return "ra=" + this.ra + " nome=" + this.nome;
            }
        }
        var aluno4 = new Aluno("123", "Vitor");
        alert(aluno4.MostraDados());
        alert(aluno4.nome);



        //func construtora sem parametro
        function Aluno2() {
            var ra; //encapsulamento-escondido
            var nome;
            this.setRa = function(value) {
                this.ra = value;
            }
            this.getRa = function() {
                return this.ra;
            }
            this.setNome = function(value) {
                this.nome = value;
            }
            this.getNome = function() {
                return this.nome;
            }
        }

        var aluno6 = new Aluno2();
        aluno6.setNome("Nickolas");
        aluno6.setRa("234");
        alert("ra=" + aluno6.getRa() + " nome=" + aluno6.getNome());

        //herança
        function AlunoADS() {
            var numLab;
            this.setnumLab = function(value) {
                this.numLab = value;
            }
            this.getnumLab = function() {
                return this.numLab;
            }
        }

        //herança
        AlunoADS.prototype = new Aluno2();
        var aluno7 = new AlunoADS();
        aluno7.setNome("Evandro");
        aluno7.setRa("123");
        aluno7.setnumLab(5);
        alert(aluno7.getNome() + " " + aluno7.getnumLab());


        //usando class
        class Aluno1 {
            constructor() {
                this._ra;
                this._nome;
            }

            setNome(value) {
                this._nome = value;
            }

            getNome() {
                return this._nome;
            }

            setRa(value){
                return this._ra = value;
            }

            getRa(){
                return this._ra;
            }
        }

        var objAluno = new Aluno1();
        objAluno.setNome("Eduardo");
        objAluno.setRa('123');
        alert(`nome=${objAluno.getNome()}
        ra=${objAluno.getRa()} `);

        //herança
        class AlunoADS1 extends Aluno1 {
            constructor() {
                //super chama o contrutor da classe pai
                super();
                this._numLab;
            }
            setNumLab(value) {
                this._numLab = value;
            }

            getNumLab(){
                return this._numLab;
            }
        }

        var objAlunoADS = new AlunoADS1();
        objAlunoADS.setNome("Caio");
        objAlunoADS.setRa("123");
        objAlunoADS.setNumLab(6);
        alert (`nome=${objAlunoADS.getNome()}
            ra=${objAlunoADS.getRa()}
            numlab=${objAlunoADS.getNumLab()}`);

        //copia de objetos
        var obj1 = new Object();
        var obj2 = obj1;
        obj1.nome = "Matheus";
        alert(obj2.nome);


        //metodos e atributos - publicos e privados
        class ContaBancaria {
            #cpf; //atrib priv

            constructor(nome, saldoInicial) {
                this.nome = nome; //atrib publi
                this.saldo = saldoInicial;
            }

            setCpf(value){
                this.cpf = value;
            }

            getCpf(){
                return this.cpf;
            }

            getSaldo() {
                return this.saldo;
            }

            //metodo publico
            depositar(valor){
                this.saldo += valor;
                this.#registrarTransacao(valor);
                //utilizando o modificador # para metodo privado
            }
            //metodo privado
            #registrarTransacao(valor) {
                console.log(`Depósito de R$ ${valor} realizado pelo ${this.nome}.
                Saldo R$ ${this.saldo} para CPF ${this.getCpf()} ou ${this.cpf}`);
            }
        }


        const arr = [
            ['codigo', 1],
            ['nome', "João"],
            ['idade', 23]
        ];

        const obj = Object.fromEntries(arr);
        alert(obj);
        alert(obj.nome);
        alert(JSON.stringify(obj));
        //conerte em json

        const conta = new ContaBancaria("Gustavo", 1000);
        conta.setCpf(123);
        conta.depositar(50);


        //alteração no prototipo reflete no novo
        const objEmpresa = {
            empresa: 'ZF do Brasil'
        };
        const funcionario =
        Object.create(objEmpresa, {
            nome: {
                value: 'Jorge'
            },
            endereco :{
                value: 'Av. São Paulo'
            }
        });
        console.log(funcionario.empresa); //ZF do Brasil
        console.log(funcionario.nome); // Jorge
        console.log(funcionario.endereco); // Av. São Paulo



        const objNovaEmpresa = {
            empresa: "ZF do Brasil"
        };

        const objVeiculo = {
            placa: 'xxx 1234'
        };
        
        const motorista = Object.assign({
            cpf:"12345678910"
        }, objNovaempresa, objVeiculo);
        console.log(motorista);
    </script>
</body>
</html>
