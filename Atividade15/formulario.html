<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Principal</title>
    <link rel="stylesheet" href="formulario.css">
    <script src="formulario.js"></script>
</head>
<body>
    <form name="nomeform" method="post" onsubmit="return validar()">
        <fieldset>
            <h1>Formulário Principal</h1>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">

            <label for="comentario">Comentário:</label>
            <textarea id="comentario" name="comentario"></textarea>

            <div class="pesquisa">
                <strong>Pesquisa:</strong>
                <p>Primeira vez nesta página?</p>

                <input type="radio" name="pesquisa" value="sim"> Sim
                <input type="radio" name="pesquisa" value="nao"> Não
            </div>

            <div class="botoes">
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </div>
        </fieldset>
    </form>
</body>
</html>
