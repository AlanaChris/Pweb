<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, papel e tesoura</title>
    <script src="jogo.js"></script>
    <link rel="stylesheet" href="jogo.css">
</head>
<body>
    <div class="container">
        <h1>Pedra ✊ Papel 📄 Tesoura ✂️</h1>

        <div class="placar">
            <div>Você: <span id="pontosJogador">0</span></div>
            <div>Computador: <span id="pontosComputador">0</span></div>
        </div>

        <div class="resultado" id="resultado">
            Clique em um botão
        </div>

        <div class="botoes">
            <button onclick="jogar('pedra')">✊ Pedra</button>
            <button onclick="jogar('papel')">📄 Papel</button>
            <button onclick="jogar('tesoura')">✂️ Tesoura</button>
        </div>

        <button class="reset" onclick="resetar()">Resetar</button>
    </div>

    
</body>
</html>
