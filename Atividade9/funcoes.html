<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções</title>
    <script src="funcoes.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Atividade 9</h1>
        
        <!-- Função 1 -->
        <div class="card">
            <h2>Maior de três números</h2>
            <input type="number" id="num1" placeholder="Número 1">
            <input type="number" id="num2" placeholder="Número 2">
            <input type="number" id="num3" placeholder="Número 3">
            <button onclick="verificarMaior()">Verificar Maior</button>
            <p id="resultado1" class="resultado"></p>
        </div>

        <!-- Função 2 -->
        <div class="card">
            <h2>Ordem crescente</h2>
            <input type="number" id="numA" placeholder="Número A">
            <input type="number" id="numB" placeholder="Número B">
            <input type="number" id="numC" placeholder="Número C">
            <button onclick="ordenarNumeros()">Ordenar</button>
            <p id="resultado2" class="resultado"></p>
        </div>

        <!-- Função 3 -->
        <div class="card">
            <h2>Verificar Palíndromo</h2>
            <input type="text" id="texto" placeholder="Digite uma palavra ou frase">
            <button onclick="verificarPalindromo()">Verificar</button>
            <p id="resultado3" class="resultado"></p>
        </div>
    </div>

</body>
</html>
