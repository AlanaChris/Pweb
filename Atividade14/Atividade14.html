<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 14</title>
</head>
<body>
    <div class="container">
        <h1>Transformador de Texto</h1>
        
        <div class="input-group">
            <label for="textInput">Digite o texto:</label>
            <input type="text" id="textInput" placeholder="Digite algo aqui...">
        </div>
        
        <div class="radio-group">
            <label>
                <input type="radio" name="transform" id="upperRadio" value="upper">
                Maiúsculas
            </label>
            
            <label>
                <input type="radio" name="transform" id="lowerRadio" value="lower">
                Minúsculas
            </label>
        </div>
        
        <div class="result">
            <h3>Resultado:</h3>
            <p id="resultText">-</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
